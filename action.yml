name: 'README the RSS'
description: 'Add your latest blog urls to your profile README'
author: 'kohrongying'
inputs:
  feed_url:
    description: 'The URL of the RSS feed'
    required: true
    default: ''
  count:
    description: 'Number of posts to display'
    default: 5
    required: false
  readme_path:
    description: 'Path to the readme file'
    required: false
    default: 'README.md'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  icon: 'archive'
  color: orange